<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream:        #f4efe6;
      --ink:          #2e2820;
      --ink-muted:    #8a7e70;
      --board-bg:     #1a1714;
      --board-deep:   #111010;
      --board-border: #2c2820;
      --tile-bg:      #232018;
      --amber:        #c8a060;
      --amber-mid:    #7a5c34;
      --amber-dim:    #3d2e1a;
      --nav-h:        60px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      color: var(--ink);
    }

    /* ─────────────────────────────────────────────
       NAV
    ───────────────────────────────────────────── */

    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(24px, 5vw, 60px);
      z-index: 100;
      background: transparent;
      opacity: 0;
      animation: fadeIn 0.7s ease forwards 0.1s;
    }

    .nav::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: clamp(24px, 5vw, 60px);
      right: clamp(24px, 5vw, 60px);
      height: 1px;
      background: rgba(200,160,96,0.15);
    }

    .nav-wordmark {
      font-weight: 300;
      font-size: clamp(0.68rem, 1.1vw, 0.84rem);
      letter-spacing: 0.38em;
      text-indent: 0.38em;
      text-transform: uppercase;
      color: var(--amber);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(20px, 3vw, 36px);
    }

    .nav-link {
      font-size: clamp(0.65rem, 1.1vw, 0.78rem);
      letter-spacing: 0.18em;
      color: var(--amber-mid);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.2s ease;
      position: relative;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0; right: 0;
      height: 1px;
      background: var(--amber);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
    }

    .nav-link:hover { color: var(--amber); }
    .nav-link:hover::after { transform: scaleX(1); }

    /* ─────────────────────────────────────────────
       BOARD — fills everything below nav
    ───────────────────────────────────────────── */

    .board {
      position: fixed;
      top: var(--nav-h);
      left: 0; right: 0; bottom: 0;
      background: var(--board-bg);
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeIn 0.9s ease forwards 0.35s;
    }

    /* top bar */
    .board-topbar {
      flex-shrink: 0;
      background: var(--board-deep);
      padding: 0 clamp(24px, 5vw, 60px);
      height: clamp(36px, 5vh, 48px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--board-border);
    }

    .board-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(0.5rem, 0.9vw, 0.62rem);
      letter-spacing: 0.32em;
      color: var(--amber);
      text-transform: uppercase;
    }

    .board-lights {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .board-light {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--amber-dim);
    }

    .board-light.on {
      background: var(--amber-mid);
      box-shadow: 0 0 5px var(--amber-mid);
    }

    /* column header */
    .board-cols {
      flex-shrink: 0;
      padding: 0 clamp(24px, 5vw, 60px);
      height: clamp(28px, 3.5vh, 38px);
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--board-border);
    }

    .col-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(0.42rem, 0.7vw, 0.52rem);
      letter-spacing: 0.28em;
      color: var(--amber-mid);
      text-transform: uppercase;
    }

    /* ── Status row ── */
    .board-status {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(10px, 2vh, 18px) clamp(24px, 5vw, 60px);
      border-bottom: 1px solid var(--board-border);
      background: rgba(200,160,96,0.03);
    }

    .board-status-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(0.58rem, 1.3vw, 0.8rem);
      letter-spacing: clamp(0.16em, 0.8vw, 0.3em);
      text-transform: uppercase;
      color: var(--amber);
      line-height: 1.6;
    }

    .board-status-text::after {
      content: '_';
      animation: blink 1.1s step-start infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* rows container */
    #boardRows {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* each city row */
    .board-row {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 clamp(24px, 5vw, 60px);
      border-bottom: 1px solid var(--board-border);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s ease;
    }

    .board-row:last-child { border-bottom: none; }
    .board-row:hover { background: rgba(200, 160, 96, 0.05); }
    .board-row:hover .tile { background: #2c2518; }

    /* ── Tags ── */
    .city-tags {
      margin-left: auto;
      display: flex;
      gap: 8px;
      align-items: center;
      opacity: 0;
      transition: opacity 0.5s ease;
      flex-shrink: 0;
    }

    .city-tags.visible { opacity: 1; }

    .tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(0.38rem, 0.7vw, 0.5rem);
      letter-spacing: 0.14em;
      color: var(--amber-mid);
      border: 1px solid var(--amber-dim);
      padding: 3px 8px;
      border-radius: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 500px) {
      .city-tags { display: none; }
    }

    /* ─────────────────────────────────────────────
       TILES
    ───────────────────────────────────────────── */

    .city-name {
      display: flex;
      gap: clamp(2px, 0.3vw, 4px);
      perspective: 800px;
    }

    .tile {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width:  clamp(1.6rem, 3.5vw, 2.8rem);
      height: clamp(2.6rem, 7vh,   4.8rem);
      background: var(--tile-bg);
      color: var(--amber);
      font-family: 'IBM Plex Mono', monospace;
      font-size:   clamp(1rem, 2.2vw, 1.8rem);
      font-weight: 500;
      border-radius: 3px;
      user-select: none;
      position: relative;
      transition: background 0.18s ease;
      transform-origin: center;
    }

    /* centre seam */
    .tile::after {
      content: '';
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 1px;
      background: rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .tile.is-space { color: transparent; }

    .tile.flipping { animation: tileFlip 140ms ease-in-out; }

    @keyframes tileFlip {
      0%   { transform: rotateX(0deg);   opacity: 1;   }
      42%  { transform: rotateX(-88deg); opacity: 0.5; }
      58%  { transform: rotateX( 88deg); opacity: 0.5; }
      100% { transform: rotateX(0deg);   opacity: 1;   }
    }

    /* ─────────────────────────────────────────────
       KEYFRAMES
    ───────────────────────────────────────────── */

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ─────────────────────────────────────────────
       RESPONSIVE
    ───────────────────────────────────────────── */

    @media (max-width: 500px) {
      :root { --nav-h: 52px; }
    }

    /* short screens — let tile height compress */
    @media (max-height: 500px) {
      .tile {
        height: clamp(1.8rem, 6vh, 3rem);
        font-size: clamp(0.8rem, 1.8vw, 1.2rem);
      }
    }
  </style>
</head>
<body>

  <!-- ── Nav ────────────────────────────────── -->
  <nav class="nav">
    <a class="nav-wordmark" href="/">Conteur</a>
    <div class="nav-links">
      <a class="nav-link" href="/about.html">About</a>
      <a class="nav-link" href="/about.html#contact">Contact</a>
    </div>
  </nav>

  <!-- ── Full-screen board ──────────────────── -->
  <div class="board">

    <div class="board-topbar">
      <span class="board-label">Departures</span>
      <div class="board-lights">
        <div class="board-light on"></div>
        <div class="board-light"></div>
        <div class="board-light"></div>
      </div>
    </div>

    <div class="board-cols">
      <span class="col-label">Destination</span>
    </div>

    <div class="board-status">
      <span class="board-status-text">Select your next destination</span>
    </div>

    <div id="boardRows"></div>

  </div>

  <script>
    const CHARSET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    const COL_W   = 11;

    const CITIES = [
      { id: 'nyc',    name: 'NEW YORK',    href: '/nyc.html'    },
      { id: 'paris',  name: 'PARIS',       href: '/paris.html'  },
      { id: 'berlin', name: 'BERLIN',      href: '/berlin.html' },
      { id: 'seoul',  name: 'SEOUL',       href: '/seoul.html'  },
      { id: 'cdmx',   name: 'MEXICO CITY', href: '/cdmx.html'   },
      { id: 'munich', name: 'MUNICH',      href: '/munich.html' },
    ];

    const ROW_TAGS = ['Art', 'Books', 'Travel'];

    const pad   = (s, n) => (s + ' '.repeat(n)).slice(0, n);
    const rchar = ()     => CHARSET[Math.floor(Math.random() * CHARSET.length)];
    const wait  = ms     => new Promise(r => setTimeout(r, ms));

    async function flipTo(tile, char) {
      tile.classList.add('flipping');
      await wait(70);
      if (char === ' ') {
        tile.textContent = ' ';
        tile.classList.add('is-space');
      } else {
        tile.textContent = char;
        tile.classList.remove('is-space');
      }
      await wait(70);
      tile.classList.remove('flipping');
    }

    async function animateTile(tile, target, startDelay) {
      await wait(startDelay);
      const cycles = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < cycles; i++) {
        await flipTo(tile, rchar());
        await wait(22 + Math.pow(i / cycles, 2) * 60);
      }
      await flipTo(tile, target);
    }

    async function animateRow(tiles, tagsEl, targetStr, rowDelay) {
      await wait(rowDelay);
      await Promise.all(
        tiles.map((tile, i) => animateTile(tile, targetStr[i], i * 36))
      );
      tagsEl.classList.add('visible');
    }

    const boardRows = document.getElementById('boardRows');

    CITIES.forEach((city, rowIdx) => {
      const padded = pad(city.name, COL_W);

      const row = document.createElement('a');
      row.className = 'board-row';
      row.href = city.href;

      const nameEl = document.createElement('div');
      nameEl.className = 'city-name';

      const tiles = Array.from({ length: COL_W }, () => {
        const t = document.createElement('span');
        t.className = 'tile is-space';
        t.textContent = ' ';
        nameEl.appendChild(t);
        return t;
      });

      const tagsEl = document.createElement('div');
      tagsEl.className = 'city-tags';
      ROW_TAGS.forEach(label => {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = label;
        tagsEl.appendChild(tag);
      });

      row.appendChild(nameEl);
      row.appendChild(tagsEl);
      boardRows.appendChild(row);

      animateRow(tiles, tagsEl, padded, 200 + rowIdx * 280);
    });
  </script>

</body>
</html>
